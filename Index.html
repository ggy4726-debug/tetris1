<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테트리스 게임</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 select-none">

    <header class="w-full max-w-md flex justify-between items-center py-2 px-4 bg-slate-800/80 backdrop-blur rounded-2xl shadow-lg border border-slate-700/50 mb-4">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-cubes text-indigo-400 text-xl"></i>
            <h1 class="font-extrabold text-lg tracking-wider bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">TETRIS</h1>
        </div>
        <div class="flex items-center space-x-3 text-sm">
            <button id="soundBtn" onclick="toggleSound()" class="text-slate-400 hover:text-white transition p-2 bg-slate-700/50 rounded-xl">
                <i id="soundIcon" class="fa-solid fa-volume-high"></i>
            </button>
            <button onclick="openModal('helpModal')" class="text-slate-400 hover:text-white transition p-2 bg-slate-700/50 rounded-xl">
                <i class="fa-solid fa-circle-question"></i>
            </button>
        </div>
    </header>

    <main class="w-full max-w-md flex flex-col items-center space-y-4">
        <!-- Score & Info Bar -->
        <div class="w-full grid grid-cols-3 gap-3 text-center">
            <div class="bg-slate-800/80 p-3 rounded-2xl border border-slate-700/50 shadow-inner">
                <span class="block text-xs text-slate-400 font-medium">점수</span>
                <span id="score" class="text-lg font-extrabold text-indigo-400">0</span>
            </div>
            <div class="bg-slate-800/80 p-3 rounded-2xl border border-slate-700/50 shadow-inner">
                <span class="block text-xs text-slate-400 font-medium">레벨</span>
                <span id="level" class="text-lg font-extrabold text-pink-400">1</span>
            </div>
            <div class="bg-slate-800/80 p-3 rounded-2xl border border-slate-700/50 shadow-inner">
                <span class="block text-xs text-slate-400 font-medium">라인</span>
                <span id="lines" class="text-lg font-extrabold text-emerald-400">0</span>
            </div>
        </div>

        <!-- Game Area & Next Preview Container -->
        <div class="relative flex bg-slate-800/90 p-4 rounded-3xl border border-slate-700/60 shadow-2xl space-x-4 items-center justify-center">
            <!-- Main Game Canvas -->
            <div class="relative overflow-hidden rounded-xl border border-slate-700 bg-slate-950">
                <canvas id="tetris" width="240" height="480" class="block"></canvas>
                
                <!-- Overlay States (Start / Pause / Game Over) -->
                <div id="overlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center transition-all duration-300">
                    <h2 id="overlayTitle" class="text-3xl font-extrabold text-white mb-2">TETRIS</h2>
                    <p id="overlayDesc" class="text-sm text-slate-300 mb-6">준비되셨나요? 아래 버튼을 눌러 시작하세요!</p>
                    <button id="actionBtn" onclick="startGame()" class="w-full py-3.5 px-6 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold rounded-xl shadow-lg transition transform active:scale-95">
                        게임 시작
                    </button>
                </div>
            </div>

            <!-- Side Panel (Next Piece & Hold) -->
            <div class="flex flex-col space-y-4 justify-between h-[480px]">
                <div class="bg-slate-900/90 p-3 rounded-2xl border border-slate-700/50 text-center flex flex-col items-center">
                    <span class="text-xs text-slate-400 font-semibold mb-2">다음 블록</span>
                    <canvas id="nextPiece" width="80" height="80" class="bg-slate-950 rounded-xl border border-slate-800"></canvas>
                </div>
                
                <!-- Controls Quick Help / Status -->
                <div class="bg-slate-900/90 p-3 rounded-2xl border border-slate-700/50 text-center flex flex-col items-center justify-center flex-1">
                    <i class="fa-solid fa-gamepad text-indigo-400 text-2xl mb-1"></i>
                    <span class="text-[10px] text-slate-400">터치 또는 키보드<br>조작 가능</span>
                </div>
            </div>
        </div>

        <!-- On-screen Controls for Mobile/Mouse -->
        <div class="w-full grid grid-cols-4 gap-2 pt-2">
            <button onclick="playerMove(-1)" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 py-3.5 rounded-xl font-bold shadow transition flex items-center justify-center">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button onclick="playerRotate()" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 py-3.5 rounded-xl font-bold shadow transition flex items-center justify-center">
                <i class="fa-solid fa-rotate"></i>
            </button>
            <button onclick="playerMove(1)" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 py-3.5 rounded-xl font-bold shadow transition flex items-center justify-center">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <button onclick="playerDrop()" class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white py-3.5 rounded-xl font-bold shadow transition flex items-center justify-center">
                <i class="fa-solid fa-arrow-down"></i>
            </button>
        </div>
    </main>

    <!-- Help Modal -->
    <div id="helpModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl max-w-sm w-full p-6 shadow-2xl relative">
            <h3 class="text-xl font-bold text-white mb-4 flex items-center">
                <i class="fa-solid fa-circle-question text-indigo-400 mr-2"></i> 게임 조작법
            </h3>
            <ul class="space-y-3 text-sm text-slate-300 mb-6">
                <li class="flex justify-between items-center bg-slate-800/60 p-2.5 rounded-xl">
                    <span>좌우 이동</span>
                    <span class="font-mono bg-slate-700 px-2 py-1 rounded text-xs text-white">← / → 키 또는 버튼</span>
                </li>
                <li class="flex justify-between items-center bg-slate-800/60 p-2.5 rounded-xl">
                    <span>회전하기</span>
                    <span class="font-mono bg-slate-700 px-2 py-1 rounded text-xs text-white">↑ 키 또는 ↻ 버튼</span>
                </li>
                <li class="flex justify-between items-center bg-slate-800/60 p-2.5 rounded-xl">
                    <span>빠른 하강</span>
                    <span class="font-mono bg-slate-700 px-2 py-1 rounded text-xs text-white">↓ 키 또는 ↓ 버튼</span>
                </li>
                <li class="flex justify-between items-center bg-slate-800/60 p-2.5 rounded-xl">
                    <span>즉시 하강 (낙하)</span>
                    <span class="font-mono bg-slate-700 px-2 py-1 rounded text-xs text-white">스페이스바</span>
                </li>
            </ul>
            <button onclick="closeModal('helpModal')" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow transition">
                확인
            </button>
        </div>
    </div>

    <!-- Custom Toast / Message Box (Replaces alert) -->
    <div id="toast" class="fixed bottom-6 bg-slate-800 text-white px-4 py-2.5 rounded-xl shadow-xl border border-slate-700 text-sm transition-all duration-300 opacity-0 pointer-events-none transform translate-y-4 z-50">
        메시지 내용
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextPiece');
        const nextContext = nextCanvas.getContext('2d');

        // Scale canvas context for clear rendering blocks
        context.scale(20, 20);
        nextContext.scale(20, 20);

        // Sound Engine using Web Audio API (No external assets required)
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            let freq = 440;
            let duration = 0.1;

            if (type === 'move') { freq = 300; duration = 0.05; }
            else if (type === 'rotate') { freq = 500; duration = 0.08; }
            else if (type === 'drop') { freq = 200; duration = 0.1; }
            else if (type === 'clear') { freq = 800; duration = 0.2; }
            else if (type === 'gameover') { freq = 120; duration = 0.5; }

            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            if (soundEnabled) {
                icon.className = "fa-solid fa-volume-high";
                showToast("효과음이 켜졌습니다.");
            } else {
                icon.className = "fa-solid fa-volume-xmark";
                showToast("효과음이 꺼졌습니다.");
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
            }, 2500);
        }

        // Tetromino shapes and vibrant colors
        const colors = [
            null,
            '#ef4444', // Red - Z
            '#3b82f6', // Blue - J
            '#10b981', // Emerald - S
            '#f59e0b', // Amber - O
            '#8b5cf6', // Purple - T
            '#06b6d4', // Cyan - I
            '#ec4899'  // Pink - L
        ];

        function createPiece(type) {
            if (type === 'T') {
                return [
                    [0, 0, 0],
                    [5, 5, 5],
                    [0, 5, 0],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'L') {
                return [
                    [0, 0, 7],
                    [7, 7, 7],
                    [0, 0, 0],
                ];
            } else if (type === 'J') {
                return [
                    [2, 0, 0],
                    [2, 2, 2],
                    [0, 0, 0],
                ];
            } else if (type === 'I') {
                return [
                    [0, 0, 0, 0],
                    [6, 6, 6, 6],
                    [0, 0, 0, 0],
                    [0, 0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 3, 3],
                    [3, 3, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'Z') {
                return [
                    [1, 1, 0],
                    [0, 1, 1],
                    [0, 0, 0],
                ];
            }
        }

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        const arena = createMatrix(12, 24);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
            lines: 0,
            level: 1,
        };

        let nextPieceType = 'I';

        function getRandomPieceType() {
            const pieces = 'TJLOSZI';
            return pieces[Math.floor(Math.random() * pieces.length)];
        }

        function arenaSweep() {
            let rowCount = 1;
            let cleared = 0;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                cleared++;
            }
            if (cleared > 0) {
                player.lines += cleared;
                player.score += cleared * 10 * player.level * cleared;
                player.level = Math.floor(player.lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (player.level - 1) * 90);
                playSound('clear');
                updateScore();
            }
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [
                        matrix[x][y],
                        matrix[y][x],
                    ] = [
                        matrix[y][x],
                        matrix[x][y],
                    ];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerDrop() {
            if (!isGameRunning) return;
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                playSound('drop');
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            if (!isGameRunning) return;
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            playSound('drop');
            dropCounter = 0;
        }

        function playerMove(dir) {
            if (!isGameRunning) return;
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            } else {
                playSound('move');
            }
        }

        function playerReset() {
            player.matrix = createPiece(nextPieceType);
            nextPieceType = getRandomPieceType();
            player.pos.y = 0;
            player.pos.x = Math.floor((arena[0].length / 2) - (player.matrix[0].length / 2));
            
            if (collide(arena, player)) {
                // Game Over
                isGameRunning = false;
                playSound('gameover');
                showGameOver();
            }
            drawNext();
        }

        function playerRotate() {
            if (!isGameRunning) return;
            const posX = player.pos.x;
            let offset = 1;
            rotate(player.matrix, 1);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -1);
                    player.pos.x = posX;
                    return;
                }
            }
            playSound('rotate');
        }

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isGameRunning = false;

        function update(time = 0) {
            if (!isGameRunning) return;
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }
            draw();
            requestAnimationFrame(update);
        }

        function drawMatrix(matrix, offset, ctx = context) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = colors[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 0.92, 0.92);
                        
                        // Glossy block border effect
                        ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        ctx.fillRect(x + offset.x, y + offset.y, 0.92, 0.15);
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#020617';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function drawNext() {
            nextContext.fillStyle = '#020617';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            const matrix = createPiece(nextPieceType);
            const offset = {
                x: (4 - matrix[0].length) / 2,
                y: (4 - matrix.length) / 2
            };
            drawMatrix(matrix, offset, nextContext);
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('level').innerText = player.level;
            document.getElementById('lines').innerText = player.lines;
        }

        function startGame() {
            // Reset arena
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.lines = 0;
            player.level = 1;
            dropInterval = 1000;
            updateScore();
            
            nextPieceType = getRandomPieceType();
            playerReset();
            
            isGameRunning = true;
            document.getElementById('overlay').classList.add('opacity-0', 'pointer-events-none');
            lastTime = performance.now();
            update();
        }

        function showGameOver() {
            const overlay = document.getElementById('overlay');
            document.getElementById('overlayTitle').innerText = "GAME OVER";
            document.getElementById('overlayDesc').innerText = `최종 점수: ${player.score}점\n수고하셨습니다! 다시 도전해보세요.`;
            document.getElementById('actionBtn').innerText = "다시 시작하기";
            overlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('flex');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('flex');
            document.getElementById(id).classList.add('hidden');
        }

        // Keyboard Controls
        document.addEventListener('keydown', event => {
            if (!isGameRunning) return;
            if (event.key === 'ArrowLeft') {
                playerMove(-1);
            } else if (event.key === 'ArrowRight') {
                playerMove(1);
            } else if (event.key === 'ArrowDown') {
                playerDrop();
            } else if (event.key === 'ArrowUp') {
                playerRotate();
            } else if (event.key === ' ') {
                playerHardDrop();
            }
        });

        // Initial draw for preview canvas
        drawNext();
    </script>
</body>
</html>
